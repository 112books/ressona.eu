section_que_fem_label: — 01
section_que_fem_title: What it takes<br>to <span>be found</span>
section_que_fem_tagline: "Leave it to us how the world finds out what you do."

srv_visual_title: Visual identity
srv_visual_desc: "Complete visual identity consulting: logo design, color palette, typography and communication tone. We deliver a style guide so everything —from web to poster— is consistent. For artists starting out or refreshing their image."
srv_photo_title: Photography & video
srv_photo_desc: Photography and video sessions crafted for your digital press kit. Natural and studio light to capture your artistic essence. Edited images ready for web, social media and press.
srv_web_title: Synced website
srv_web_desc: We build your website as a showcase, tool and calendar. Synced with your social channels, calendar and contact form. Responsive, fast and search-engine optimized. For musicians, actors and companies needing professional digital presence.
srv_social_title: Automated social
srv_social_desc: "We manage and automate your social media: calendar, formats and voice. Post when it matters, silence when it doesn't. You do your work; we handle the communication."
srv_ai_title: AI with judgment
srv_ai_desc: "We integrate AI tools into your workflow: text automation, data analysis, idea generation. Ethical and practical consulting for artists. Without losing your voice or control."
srv_presskit_title: Digital press kit
srv_presskit_desc: "One place with everything you need to open doors: bio, photos, videos, contact and links. Web and PDF formats. Perfect for programmers, media and venues. Updated whenever you change."
srv_search_title: Search & AI listing
srv_search_desc: We list your profile on Google, Bing, Perplexity and ChatGPT. We optimize your content so you appear when searched. Includes keyword analysis and quarterly ranking tracking.
srv_print_title: Print materials
srv_print_desc: Poster, flyer, business card and print design for concerts, exhibitions and shows. From digital design to print. We coordinate printing if needed.
srv_strategy_title: Social strategy
srv_strategy_desc: "We design the social media strategy that works for you: what to post, where, when and in what tone. We analyze your audience, competition and best-performing formats. You stay in control."

