section_quisom_label: — 03
section_quisom_title: Who we are
section_quisom_tagline: Ressona emerges from the confluence of <span>photography</span>, <span>technology</span> and <span>editorial vision</span>. A broad perspective for building digital identity.

about_pillar_photo_title: Photography
about_pillar_photo_desc: Years of experience capturing the essence of artists and creators. The image as the first layer of digital identity.
about_pillar_tech_title: Technology
about_pillar_tech_desc: Infrastructure, automation and AI serving artistic communication. The code that makes talent visible.
about_pillar_editorial_title: Editorial vision
about_pillar_editorial_desc: Curatorial judgment and cultural context. Every artist is a unique publication deserving a coherent narrative.

section_com_label: — 04
section_com_title: How we do it,<br><span>step by step</span>

step_1_title: We listen
step_1_desc: The project. The context. What you truly need.
step_2_title: We design
step_2_desc: A tailored, modular proposal. What makes sense for you.
step_3_title: We build
step_3_desc: Block by block, linearly, with the best professionals for each need.
step_4_title: We accompany
step_4_desc: The system runs itself. But we're still here.
step_5_title: We monitor and interpret
step_5_desc: "We always audit the current state of each project at the start. When finished, we do it again — this time with data that shows the impact of every process."

