section_que_fem_label: — 01
section_que_fem_title: Tot el que cal<br>per <span>ser trobat</span>
section_que_fem_tagline: "Deixa a les nostres mans com el món descobreix el que fas."

srv_visual_title: Identitat visual
srv_visual_desc: "Assessoria completa d'identitat visual: disseny de logotip, paleta de color, tipografia i to de comunicació. Et lliurem un manual d'ús perquè tot —del web al cartell— sigui coherent. Per a artistes que comencen o necessiten renovar la seva imatge."
srv_photo_title: Fotografia i vídeo
srv_photo_desc: Sessions de fotografia i vídeo pensades per al press kit digital de l'artista. Llum natural i artificial per capturar la teva essència. Imatges editades i preparades per a web, xarxes socials i mitjans de comunicació.
srv_web_title: Web sincronitzada
srv_web_desc: Construïm el teu web com a aparador, eina i agenda. Sincronitzat amb les teves xarxes, calendari i formulari de contacte. Responsive, ràpid i optimitzat per a cercadors. Per a músics, actors i companyies que necessiten presència digital professional.
srv_social_title: Xarxes automàtiques
srv_social_desc: "Gestionem i automatitzem les teves xarxes socials: calendari, formats i veu. Publiques quan toca, calles quan no. Tu fas la teva feina; nosaltres ens encarreguem de comunicar-ho."
srv_ai_title: IA amb criteri
srv_ai_desc: "Integrem eines d'intel·ligència artificial en el teu flux de treball: automatització de textos, anàlisi de dades, generació d'idees. Assessoria ètica i pràctica per a artistes. Sense perdre la teva veu ni el control."
srv_presskit_title: Press kit digital
srv_presskit_desc: "Un sol lloc amb tot el que necessites per obrir portes: bio, fotos, vídeos, contacte i enllaços. En format web i PDF. Perfecte per a programadors, mitjans i sales. L'actualitzem cada cop que canvïis."
srv_search_title: Alta a cercadors i IA
srv_search_desc: Donem d'alta el teu perfil a Google, Bing, Perplexity i ChatGPT. Optimitzem el teu contingut perquè apareguis quan et busquin. Inclou anàlisi de paraules clau i seguiment trimestral de posicionament.
srv_print_title: Cartelleria i materials
srv_print_desc: Disseny de pòsters, flyers, targetes de visita i cartelleria per a concerts, exposicions i espectacles. Del disseny digital al paper. Coordinem impressió si ho necessites.
srv_strategy_title: Estratègia de xarxes
srv_strategy_desc: "Dissenyem l'estratègia de xarxes que funciona per a tu: què publicar, on, quan i amb quin to. Analitzem el teu públic, la competència i els formats que millor funcionen. Tu mantens el control."

section_per_qui_label: — 02
section_per_qui_title: Per a qui<br><span>crea i actua</span>

aud_music: Músics
aud_music_desc: De la maqueta al concert. Tot el camí digital.
aud_actors: Actors
aud_actors_desc: Book, showreel, presència. Per a càstings i més.
aud_circus: Circ i escena
aud_circus_desc: Companyies, espectacles, gires. Fora de l'escenari també.
aud_dance: Dansa
aud_dance_desc: Moviment, calendari, classes. El teu cos digital.
aud_visual: Arts plàstiques
aud_visual_desc: Portfolio, galeria. Per a galeries i col·leccionistes.
aud_emerging: Emergents
aud_emerging_desc: El primer pas. La base. Tot per construir.

section_quisom_label: — 03
section_quisom_title: Qui som
section_quisom_tagline: Ressona és un projecte de Joan Mz, creat a Barcelona a partir de tres branques de treball complementàries. Una mirada àmplia per construir identitat digital per a artistes.

about_pillar_photo_title: Fotografia i identitat visual
about_pillar_photo_desc: "<a href=\"https://pocallum.cat\" target=\"_blank\" rel=\"noopener\">Pocallum</a> aporta anys d'experiència en fotografia artística, disseny de logotips i identitat visual. La imatge com a primera capa de la marca d'un artista."
about_pillar_tech_title: Tecnologia i automatització
about_pillar_tech_desc: "<a href=\"https://linuxbcn.com\" target=\"_blank\" rel=\"noopener\">LinuxBCN</a> aporta la infraestructura digital: webs estàtics, automatitzacions, IA aplicada i programari lliure. El codi que fa visible el talent."
about_pillar_editorial_title: Comunicació i editorial
about_pillar_editorial_desc: "<a href=\"https://112books.eu\" target=\"_blank\" rel=\"noopener\">112books</a> aporta criteri editorial i experiència en comunicació cultural. Cada artista és una publicació única que mereix una narrativa coherent."

section_com_label: — 04
section_com_title: Com ho fem,<br><span>pas a pas</span>

step_1_title: Escoltem
step_1_desc: El projecte. El context. El que necessites de veritat.
step_2_title: Dissenyem
step_2_desc: Una proposta a mida i modular. Amb el que té sentit per a tu.
step_3_title: Construïm
step_3_desc: Bloc a bloc, de forma lineal i amb els millors professionals per a cada necessitat.
step_4_title: Acompanyem
step_4_desc: El sistema funciona sol. Però seguim aquí.
step_5_title: Monitoritzem i interpretem
step_5_desc: "A l'inici sempre auditem l'estat actual de cada projecte. En acabar ho tornem a fer i aquest cop amb les dades que determinen l'impacte de cada procés."

