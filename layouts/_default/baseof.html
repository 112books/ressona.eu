<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ i18n "hero_brand" }} · {{ i18n "hero_tagline" }}{{ else }}{{ .Title }} · {{ i18n "hero_brand" }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "hero_tagline" }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}
  <link rel="alternate" hreflang="x-default" href="{{ .Site.BaseURL }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ i18n "hero_brand" }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "hero_tagline" }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ if eq .Language.Lang "ca" }}ca_ES{{ else }}en_GB{{ end }}">
  <meta property="og:site_name" content="{{ i18n "hero_brand" }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}img/ressona-eu-rounded.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ i18n "hero_brand" }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "hero_tagline" }}{{ end }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}img/ressona-eu-rounded.png">
  <meta name="theme-color" content="#34454c">
  <link rel="icon" href="/img/ressona-eu-rounded.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ if .Site.Params.goatcounter }}
  <script data-goatcounter="https://{{ .Site.Params.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {{ end }}
  <noscript><style>.hero-tagline { visibility: visible; }</style></noscript>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Ressona",
    "alternateName": "Ressona — {{ i18n "hero_tagline" }}",
    "url": "{{ .Site.BaseURL }}",
    "description": "{{ i18n "hero_tagline" }}",
    "inLanguage": "{{ .Site.Language.Lang }}"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Ressona",
    "url": "{{ .Site.BaseURL }}",
    "logo": "{{ .Site.BaseURL }}img/ressona-logo.svg",
    "sameAs": [
      "{{ .Site.Params.instagram }}"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "{{ .Site.Params.email }}",
      "contactType": "customer support",
      "availableLanguage": ["Catalan", "English", "Spanish"]
    }
  }
  </script>
  {{ if not .IsHome }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,
      "name": "{{ i18n "hero_brand" }}",
      "item": "{{ .Site.BaseURL }}"
    },{{ if not (eq .Kind "section") }}
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }{{ end }}]
  }
  </script>
  {{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "progress.html" . }}
  <script>
  (function(){
    var tagline = document.querySelector('.hero-tagline');
    if (tagline) {
      var text = tagline.textContent;
      tagline.textContent = '';
      tagline.style.visibility = 'visible';
      var i = 0;
      function type() {
        if (i < text.length) {
          tagline.textContent += text.charAt(i);
          i++;
          tagline.classList.toggle('typing-cursor', i < text.length);
          setTimeout(type, 35 + Math.random() * 25);
        } else {
          tagline.classList.add('typing-done');
          tagline.classList.remove('typing-cursor');
        }
      }
      setTimeout(type, 800);
    }

    var items = document.querySelectorAll('.audience-item');
    items.forEach(function(el, idx) {
      var dx = (Math.random() - 0.5) * 60;
      var dy = (Math.random() - 0.5) * 40;
      el.style.setProperty('--drift-x', dx + 'px');
      el.style.setProperty('--drift-y', dy + 'px');
      el.style.animationDelay = (0.2 + idx * 0.1) + 's';
    });
  })();
  </script>
</body>
</html>
