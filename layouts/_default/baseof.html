<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ i18n "hero_brand" }} · {{ i18n "hero_tagline" }}</title>
  <meta name="description" content="{{ i18n "hero_tagline" }}">
  <meta property="og:title" content="{{ i18n "hero_brand" }}">
  <meta property="og:description" content="{{ i18n "hero_tagline" }}">
  <meta property="og:url" content="{{ .Site.BaseURL }}{{ .Language.Lang }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0c0b09">
  <link rel="icon" href="/img/ressona-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ if .Site.Params.goatcounter }}
  <script data-goatcounter="https://{{ .Site.Params.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {{ end }}
  <noscript><style>.hero-tagline { visibility: visible; }</style></noscript>
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "progress.html" . }}
  <script>
  (function(){
    var tagline = document.querySelector('.hero-tagline');
    if (tagline) {
      var text = tagline.textContent;
      tagline.textContent = '';
      tagline.style.visibility = 'visible';
      var i = 0;
      function type() {
        if (i < text.length) {
          tagline.textContent += text.charAt(i);
          i++;
          tagline.classList.toggle('typing-cursor', i < text.length);
          setTimeout(type, 35 + Math.random() * 25);
        } else {
          tagline.classList.add('typing-done');
          tagline.classList.remove('typing-cursor');
        }
      }
      setTimeout(type, 800);
    }

    var items = document.querySelectorAll('.audience-item');
    items.forEach(function(el, idx) {
      var dx = (Math.random() - 0.5) * 60;
      var dy = (Math.random() - 0.5) * 40;
      el.style.setProperty('--drift-x', dx + 'px');
      el.style.setProperty('--drift-y', dy + 'px');
      el.style.animationDelay = (0.2 + idx * 0.1) + 's';
    });
  })();
  </script>
</body>
</html>
