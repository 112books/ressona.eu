<div class="search-overlay" id="searchOverlay" hidden role="dialog" aria-modal="true" aria-label="{{ if eq .Language.Lang "ca" }}Cerca{{ else }}Search{{ end }}">
  <div class="search-box">
    <div class="search-header">
      <svg class="search-icon-label" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="{{ if eq .Language.Lang "ca" }}Cerca articles i guies...{{ else }}Search articles and guides...{{ end }}" autocomplete="off" spellcheck="false" aria-label="{{ if eq .Language.Lang "ca" }}Cerca{{ else }}Search{{ end }}">
      <button class="search-close" id="searchClose" aria-label="{{ if eq .Language.Lang "ca" }}Tancar cerca{{ else }}Close search{{ end }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="searchResults" class="search-results" role="list"></div>
    <p class="search-hint">{{ if eq .Language.Lang "ca" }}Premeu <kbd>Esc</kbd> per tancar · <kbd>/</kbd> per obrir{{ else }}Press <kbd>Esc</kbd> to close · <kbd>/</kbd> to open{{ end }}</p>
  </div>
</div>

<script>
(function(){
  var overlay = document.getElementById('searchOverlay');
  var input   = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  var toggle  = document.getElementById('searchToggle');
  var closeBtn= document.getElementById('searchClose');
  var index   = null;
  var loading = false;
  var lang    = document.documentElement.lang || 'ca';
  var isCA    = lang !== 'en';
  var indexUrl= isCA ? '/index.json' : '/en/index.json';
  var t       = {
    noResults: isCA ? 'Sense resultats' : 'No results',
    loading:   isCA ? 'Carregant...' : 'Loading...',
    for:       isCA ? 'per' : 'for'
  };

  function openSearch() {
    overlay.removeAttribute('hidden');
    document.body.style.overflow = 'hidden';
    input.focus();
    if (!index && !loading) {
      loading = true;
      results.innerHTML = '<p class="search-status">' + t.loading + '</p>';
      fetch(indexUrl)
        .then(function(r){ return r.json(); })
        .then(function(data){
          index = data;
          loading = false;
          if (input.value.trim()) doSearch(input.value.trim());
          else results.innerHTML = '';
        })
        .catch(function(){ loading = false; results.innerHTML = ''; });
    }
  }

  function closeSearch() {
    overlay.setAttribute('hidden', '');
    document.body.style.overflow = '';
    input.value = '';
    results.innerHTML = '';
  }

  function doSearch(q) {
    if (!index) return;
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) { results.innerHTML = ''; return; }
    var scored = index.map(function(p) {
      var title = (p.title || '').toLowerCase();
      var desc  = (p.description || '').toLowerCase();
      var body  = (p.content || '').toLowerCase();
      var score = 0;
      terms.forEach(function(t) {
        if (title.includes(t)) score += 10;
        if (desc.includes(t))  score += 5;
        if (body.includes(t))  score += 1;
      });
      return { p: p, s: score };
    }).filter(function(x){ return x.s > 0; }).sort(function(a,b){ return b.s - a.s; });

    if (!scored.length) {
      results.innerHTML = '<p class="search-status">' + t.noResults + ' ' + t.for + ' «' + q + '»</p>';
      return;
    }
    results.innerHTML = scored.slice(0, 8).map(function(x) {
      var p = x.p;
      return '<a href="' + p.url + '" class="search-result" role="listitem">' +
        '<span class="search-result__title">' + p.title + '</span>' +
        (p.description ? '<span class="search-result__desc">' + p.description + '</span>' : '') +
        '</a>';
    }).join('');
  }

  if (toggle) toggle.addEventListener('click', openSearch);
  if (closeBtn) closeBtn.addEventListener('click', closeSearch);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeSearch(); });
  input.addEventListener('input', function(){ doSearch(this.value.trim()); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !overlay.hasAttribute('hidden')) closeSearch();
    if (e.key === '/' && overlay.hasAttribute('hidden') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      openSearch();
    }
  });
})();
</script>
