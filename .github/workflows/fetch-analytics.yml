name: Fetch GoatCounter Analytics

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch analytics data
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_ACCOUNT: "ressona"
        run: |
          END=$(date +%Y-%m-%d)
          START=$(date -d '365 days ago' +%Y-%m-%d)
          BASE="https://${GC_ACCOUNT}.goatcounter.com/api/v0"
          AUTH="Authorization: Bearer ${GC_TOKEN}"

          fetch_to_file() {
            local url="$1" outfile="$2" timeout="${3:-15}"
            curl -sf --max-time "${timeout}" --retry 2 -H "${AUTH}" "${url}" -o "${outfile}" 2>/dev/null \
              || echo "null" > "${outfile}"
            python3 -c "import json; json.load(open('${outfile}'))" 2>/dev/null \
              || echo "null" > "${outfile}"
            echo "DEBUG ${outfile}: $(wc -c < ${outfile}) bytes"
          }

          fetch_to_file "${BASE}/stats/hits?start=${START}&end=${END}&limit=100" /tmp/hits.json 60
          fetch_to_file "${BASE}/stats/total?start=${START}&end=${END}"          /tmp/total.json
          fetch_to_file "${BASE}/stats/browsers?start=${START}&end=${END}&limit=10"  /tmp/browsers.json
          fetch_to_file "${BASE}/stats/systems?start=${START}&end=${END}&limit=10"   /tmp/systems.json
          fetch_to_file "${BASE}/stats/sizes?start=${START}&end=${END}&limit=10"     /tmp/sizes.json
          fetch_to_file "${BASE}/stats/locations?start=${START}&end=${END}&limit=15" /tmp/locations.json
          fetch_to_file "${BASE}/stats/toprefs?start=${START}&end=${END}&limit=10"   /tmp/refs.json

          python3 scripts/build-analytics-json.py "${START}" "${END}"

      - name: Process analytics
        run: |
          python3 scripts/process-analytics.py \
            /tmp/raw_all.json \
            static/admin/analytics.json \
            "$(date -d '365 days ago' +%Y-%m-%d)" \
            "$(date +%Y-%m-%d)"

      - name: Commit analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp static/admin/analytics.json /tmp/analytics_fresh.json
          git checkout -- static/admin/analytics.json
          git pull --rebase
          cp /tmp/analytics_fresh.json static/admin/analytics.json
          git add static/admin/analytics.json
          git diff --staged --quiet || git commit -m "chore: update analytics [skip ci]"
          git push

      - name: Push analytics to gh-pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cp static/admin/analytics.json /tmp/analytics.json
          git fetch origin gh-pages
          git checkout gh-pages
          git pull --rebase origin gh-pages
          cp /tmp/analytics.json admin/analytics.json
          git add admin/analytics.json
          git diff --staged --quiet || git commit -m "chore: update analytics live [skip ci]"
          git push origin gh-pages
          git checkout main
