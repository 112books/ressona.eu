name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.0/hugo_extended_0.159.0_linux-amd64.tar.gz
          tar -xzf hugo_extended_0.159.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Build Hugo
        run: hugo --minify --baseURL "https://ressona.eu/"

      - name: Deploy a gh-pages
        run: |
          cd public
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy $(date +'%Y-%m-%d %H:%M')"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git branch -M gh-pages
          git push --force origin gh-pages

      - name: Notify IndexNow (Bing, Yandex)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "ressona.eu",
              "key": "98cc5eb439e66231e6a7821b576a1b30",
              "keyLocation": "https://ressona.eu/98cc5eb439e66231e6a7821b576a1b30.txt",
              "urlList": [
                "https://ressona.eu/",
                "https://ressona.eu/en/",
                "https://ressona.eu/serveis/identitat-visual/",
                "https://ressona.eu/serveis/fotografia-video/",
                "https://ressona.eu/serveis/web-artistes/",
                "https://ressona.eu/serveis/press-kit-digital/",
                "https://ressona.eu/serveis/alta-cercadors-ia/",
                "https://ressona.eu/serveis/xarxes-automatiques/",
                "https://ressona.eu/serveis/ia-amb-criteri/",
                "https://ressona.eu/serveis/cartelleria-materials/",
                "https://ressona.eu/serveis/estrategia-xarxes/",
                "https://ressona.eu/legal/avis-legal/",
                "https://ressona.eu/legal/privacitat/",
                "https://ressona.eu/legal/cookies/",
                "https://ressona.eu/en/legal/legal-notice/",
                "https://ressona.eu/en/legal/privacy/",
                "https://ressona.eu/en/legal/cookies/"
              ]
            }' || true

      - name: Core Web Vitals audit
        run: |
          sleep 15
          npm install -g lighthouse --silent 2>/dev/null
          lighthouse https://ressona.eu \
            --output=json \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output-path=/tmp/lh-report.json || true

          python3 - <<'EOF'
          import json, os, sys
          try:
            with open('/tmp/lh-report.json') as f:
              d = json.load(f)
            cats = d.get('categories', {})
            auds = d.get('audits', {})
            scores = {k: round(v.get('score', 0) * 100) for k, v in cats.items()}
            lcp  = auds.get('largest-contentful-paint', {}).get('displayValue', 'n/a')
            fcp  = auds.get('first-contentful-paint', {}).get('displayValue', 'n/a')
            cls  = auds.get('cumulative-layout-shift', {}).get('displayValue', 'n/a')
            tbt  = auds.get('total-blocking-time', {}).get('displayValue', 'n/a')

            summary = f"""## Core Web Vitals — ressona.eu

| Categoria | Puntuació |
|-----------|-----------|
| Performance | {scores.get('performance', '?')} |
| Accessibility | {scores.get('accessibility', '?')} |
| Best Practices | {scores.get('best-practices', '?')} |
| SEO | {scores.get('seo', '?')} |

| Mètrica | Valor |
|---------|-------|
| LCP (Largest Contentful Paint) | {lcp} |
| FCP (First Contentful Paint) | {fcp} |
| CLS (Cumulative Layout Shift) | {cls} |
| TBT (Total Blocking Time) | {tbt} |
"""
            summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/summary.md')
            with open(summary_path, 'a') as f:
              f.write(summary)
            print(summary)
          except Exception as e:
            print(f"Lighthouse report not available: {e}")
          EOF
