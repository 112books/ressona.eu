<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Perseguint el Duende — Mapa de Flamenc per Europa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; }

    .header {
      background: #2c0b0b;
      color: #f5f5f0;
      padding: 20px 30px;
      text-align: center;
      border-bottom: 3px solid #c0392b;
    }
    .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 5px; }
    .header p { font-size: 14px; color: #aaa; }

    .controls {
      background: #2c2c2c;
      padding: 15px 30px;
      border-bottom: 1px solid #444;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .controls button {
      padding: 8px 18px;
      border: 2px solid #c0392b;
      background: transparent;
      color: #f5f5f0;
      border-radius: 25px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .controls button:hover, .controls button.active {
      background: #c0392b;
      color: #fff;
    }
    .controls .legend {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 13px;
      color: #aaa;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot.tablao { background: #c0392b; }
    .legend-dot.pena { background: #e67e22; }
    .legend-dot.festival { background: #f1c40f; }

    #map { height: calc(100vh - 140px); width: 100%; }

    .popup-content { min-width: 220px; }
    .popup-content h3 { 
      margin: 0 0 6px; 
      font-size: 15px; 
      font-weight: 600;
      color: #2c0b0b;
    }
    .popup-content .meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .popup-content p { 
      margin: 0 0 10px; 
      font-size: 13px; 
      color: #555;
      line-height: 1.4;
    }
    .popup-content a { 
      color: #c0392b; 
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .popup-content a:hover { text-decoration: underline; }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .leaflet-popup-content { margin: 14px 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Perseguint el Duende</h1>
    <p>Tablaos, peñas i festivals de flamenc — Mapa interactiu per a Ressona.eu</p>
  </div>

  <div class="controls">
    <button onclick="filterAll()" class="active" id="btn-all">Tots</button>
    <button onclick="filterTablaos()" id="btn-tablaos">Tablaos</button>
    <button onclick="filterPenas()" id="btn-penas">Peñas</button>
    <button onclick="filterFestivals()" id="btn-festivals">Festivals</button>
    <div class="legend">
      <span><span class="legend-dot tablao"></span> Tablaos</span>
      <span><span class="legend-dot pena"></span> Peñas</span>
      <span><span class="legend-dot festival"></span> Festivals</span>
    </div>
  </div>

  <div id="map"></div>

      { name: "Peña Flamenca Tío José de Paula", type: "peña", city: "Jerez de la Frontera", address: "Jerez", lat: 36.6880, lng: -6.1400, url: "", desc: "Homenatge al gran cantaor Tío José de Paula." },
      { name: "Peña Flamenca El Garbanzo de Jerez", type: "peña", city: "Jerez de la Frontera", address: "Jerez", lat: 36.6850, lng: -6.1380, url: "", desc: "Programació regular per a la comunitat flamenca." },
      { name: "Peña Flamenca Niño de la Huerta", type: "peña", city: "Jerez de la Frontera", address: "Jerez", lat: 36.6900, lng: -6.1350, url: "", desc: "Dedicada a la memòria del cantaor." },
      { name: "Peña Flamenca El Zoco", type: "peña", city: "Jerez de la Frontera", address: "Jerez", lat: 36.6840, lng: -6.1420, url: "", desc: "Espai de trobada per a aficionats al flamenc." },

      // TABLAOS - MÀLAGA
      { name: "Kelipe Centro de Arte Flamenco", type: "tablao", city: "Màlaga", address: "Calle Calderería 6, 29008", lat: 36.7200, lng: -4.4200, url: "https://www.kelipe.net/", desc: "Espai íntim al centre històric. Classes i espectacles." },
      { name: "Tablao Flamenco Los Amayas", type: "tablao", city: "Màlaga", address: "Málaga", lat: 36.7250, lng: -4.4150, url: "", desc: "Flamenc tradicional en ambient autèntic." },

      // TABLAOS - CÒRDOVA
      { name: "Tablao El Cardenal", type: "tablao", city: "Còrdova", address: "Calle de Torrijos 10, 14003", lat: 37.8790, lng: -4.7800, url: "https://www.tablaoelcardenal.com/", desc: "Al costat de la Mesquita-Catedral. Pati andalús." },
      { name: "Tablao Flamenco El Tablao", type: "tablao", city: "Còrdova", address: "Córdoba", lat: 37.8850, lng: -4.7750, url: "", desc: "Flamenc tradicional al centre històric." },

      // TABLAOS - LONDRES
      { name: "Ronnie Scott's Jazz Club", type: "tablao", city: "Londres", address: "47 Frith Street, London W1D 4HT", lat: 51.5130, lng: -0.1315, url: "https://www.ronniescotts.co.uk/", desc: "Ocasionalment programa flamenc i fusió flamenca." },

      // PEÑAS - LONDRES
      { name: "Peña Flamenca de Londres", type: "peña", city: "Londres", address: "Londres", lat: 51.5100, lng: -0.1200, url: "https://www.penaflamencadelondres.com/", desc: "La peña flamenca més antiga del Regne Unit." },

      // TABLAOS - PARÍS
      { name: "Casa Patas (París)", type: "tablao", city: "París", address: "París", lat: 48.8566, lng: 2.3522, url: "", desc: "Filial parisenca de la mítica Casa Patas de Madrid." },
      { name: "Tablao Flamenco de París", type: "tablao", city: "París", address: "París", lat: 48.8600, lng: 2.3500, url: "", desc: "Flamenc tradicional per a públic francès i internacional." },

      // PEÑAS - AMSTERDAM
      { name: "Pena Flamenca de Amsterdam", type: "peña", city: "Amsterdam", address: "Amsterdam", lat: 52.3676, lng: 4.9041, url: "", desc: "Programació regular de concerts i classes." },

      { name: "Festival de Jerez", type: "festival", city: "Jerez de la Frontera", address: "Diversos espais de Jerez", lat: 36.6860, lng: -6.1360, url: "https://www.festivaldejerez.es/", desc: "Febrer 2027. Un dels festivals més prestigiosos." },
      { name: "Suma Flamenca", type: "festival", city: "Madrid", address: "Teatros del Canal, Madrid", lat: 40.4380, lng: -3.7050, url: "https://www.sumaflamenca.com/", desc: "Juny 2027. Tres setmanes de flamenc a Madrid." },

      { name: "Festival de Flamenco de Londres", type: "festival", city: "Londres", address: "Londres", lat: 51.5150, lng: -0.1250, url: "", desc: "Principal festival de flamenc del Regne Unit." },
      { name: "Festival de Flamenco d'Amsterdam", type: "festival", city: "Amsterdam", address: "Amsterdam", lat: 52.3700, lng: 4.9100, url: "", desc: "Programació de flamenc a diversos espais." },

      { name: "Festival de Flamenco de Nou Barris", type: "festival", city: "Barcelona", address: "Ateneu de Nou Barris · C/ Virgen de Begoña 2, 08035", lat: 41.4421, lng: 2.1798, url: "", desc: "Festival de referència al barri de Nou Barris. Artistes consolidats en un entorn de barri. Organitzat des del Districte de Nou Barris." },
      { name: "Flamenco de Barrio", type: "festival", city: "Barcelona", address: "Places i patis de Nou Barris, Barcelona", lat: 41.4395, lng: 2.1785, url: "https://www.instagram.com/flamencodebarrio_oficial/", desc: "Novembre. Flamenc en espais no convencionals del barri: places, patis, espais quotidians. Artistes emergents i veterans. Sense escenari ni cerimònies — flamenc cru i emocional." },
      { name: "Ciutat Flamenco Barcelona", type: "festival", city: "Barcelona", address: "Diverses sales de Barcelona", lat: 41.3905, lng: 2.1715, url: "https://ciutatflamenco.com/", desc: "Octubre (19-26). Organitzat pel Taller de Músics. Tracta el flamenc com un art viu, en evolució permanent. Prioritza el ball com a element protagonista i la recerca audiovisual i interdisciplinària." }
    ];

    var markers = L.markerClusterGroup();
    var allMarkers = [];
    var tablaoMarkers = [];
    var penaMarkers = [];
    var festivalMarkers = [];

    locations.forEach(function(loc) {
      var icon = loc.type === 'tablao' ? tablaoIcon : loc.type === 'peña' ? penaIcon : festivalIcon;
      var marker = L.marker([loc.lat, loc.lng], { icon: icon });

      var typeLabel = loc.type === 'tablao' ? 'TABLAO' : loc.type === 'peña' ? 'PEÑA' : 'FESTIVAL';
      var popupContent = 
        '<div class="popup-content">' +
        '<div class="meta">' + typeLabel + ' · ' + loc.city + '</div>' +
        '<h3>' + loc.name + '</h3>' +
        '<p>' + loc.address + '</p>' +
        '<p>' + loc.desc + '</p>' +
        (loc.url ? '<a href="' + loc.url + '" target="_blank">Més info →</a>' : '') +
        '</div>';

      marker.bindPopup(popupContent);
      markers.addLayer(marker);
      allMarkers.push(marker);

      if (loc.type === 'tablao') tablaoMarkers.push(marker);
      else if (loc.type === 'peña') penaMarkers.push(marker);
      else festivalMarkers.push(marker);
    });

    map.addLayer(markers);

    var group = new L.featureGroup(allMarkers);
    map.fitBounds(group.getBounds().pad(0.1));

    function filterAll() {
      map.removeLayer(markers);
      markers.clearLayers();
      allMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-all');
    }

    function filterTablaos() {
      map.removeLayer(markers);
      markers.clearLayers();
      tablaoMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-tablaos');
    }

    function filterPenas() {
      map.removeLayer(markers);
      markers.clearLayers();
      penaMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-penas');
    }

    function filterFestivals() {
      map.removeLayer(markers);
      markers.clearLayers();
      festivalMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-festivals');
    }

    function updateButtons(activeId) {
      ['btn-all', 'btn-tablaos', 'btn-penas', 'btn-festivals'].forEach(function(id) {
        document.getElementById(id).classList.toggle('active', id === activeId);
      });
    }
  </script>
</body>
