<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classical Music & Opera Map Europe · Ressona</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0a1020; color: #d9d0d5; }
  #map { width: 100%; height: 100vh; }
  .controls {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(10,16,32,0.93); border: 1px solid rgba(200,168,75,0.3);
    padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  }
  .ctrl-btn {
    background: transparent; border: 1px solid rgba(200,168,75,0.35);
    color: #d9d0d5; padding: 5px 10px; cursor: pointer; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase; text-align: left;
    transition: all .15s;
  }
  .ctrl-btn:hover, .ctrl-btn.active { background: #c8a84b; color: #0a1020; border-color: #c8a84b; }
  .ctrl-label { color: rgba(217,208,213,0.45); font-size: 9px; margin-bottom: 2px; }
  .leaflet-popup-content-wrapper {
    background: #0a1020; color: #d9d0d5; border: 1px solid rgba(200,168,75,0.3);
    border-radius: 2px; box-shadow: 0 4px 20px rgba(0,0,0,0.7);
  }
  .leaflet-popup-tip { background: #0a1020; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 12px; line-height: 1.6; min-width: 180px; }
  .pop-name { font-weight: 600; color: #c8a84b; margin-bottom: 3px; font-size: 13px; }
  .pop-type { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(217,208,213,0.5); margin-bottom: 5px; }
  .pop-info { color: rgba(217,208,213,0.8); margin-bottom: 5px; }
  .pop-link a { color: #5a9fd4; text-decoration: none; font-size: 11px; }
  .pop-link a:hover { color: #c8a84b; }
  .marker-custom { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.6); }
  .marker-festival { background: #c8a84b; border: 2px solid #f0d07a; }
  .marker-opera    { background: #a02040; border: 2px solid #d04060; }
  .marker-sala     { background: #2a6fa8; border: 2px solid #5a9fd4; }
</style>
</head>
<body>
<div id="map"></div>
<div class="controls">
  <div class="ctrl-label">Filter by</div>
  <button class="ctrl-btn active" onclick="filterType('all',this)">All</button>
  <button class="ctrl-btn" onclick="filterType('festival',this)">Festivals</button>
  <button class="ctrl-btn" onclick="filterType('opera',this)">Opera</button>
  <button class="ctrl-btn" onclick="filterType('sala',this)">Concert halls</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map = L.map('map', { zoomControl: true, scrollWheelZoom: false }).setView([48.5, 10.5], 4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 18
}).addTo(map);

function makeIcon(type) {
  const cls = 'marker-' + type;
  return L.divIcon({ className: 'marker-custom ' + cls, iconSize: [12,12], iconAnchor: [6,6], popupAnchor: [0,-8] });
}

const typeLabel = { festival: '🎭 Festival', opera: '🎼 Opera house', sala: '🎹 Concert hall' };

const locations = [
  // VIENA
  { type:'opera',    name:'Wiener Staatsoper',        city:'Vienna, Austria',     desc:'Founded 1869. Around 300 performances per season with daily title changes. The densest opera schedule in Europe.',                      url:'https://www.wiener-staatsoper.at/', lat:48.2032, lng:16.3695 },
  { type:'sala',     name:'Wiener Musikverein',        city:'Vienna, Austria',     desc:'Founded 1870. Widely regarded as the world\'s finest concert hall acoustics. Home of the Vienna Philharmonic and New Year\'s Concert.',                         url:'https://www.musikverein.at/',       lat:48.2003, lng:16.3724 },
  { type:'festival', name:'Wien Modern',               city:'Vienna, Austria',     mes:'November', desc:'Since 1988. Festival of contemporary and avant-garde music at the Konzerthaus and other Vienna venues.',                              url:'https://www.wienmodern.at/',        lat:48.2007, lng:16.3810 },
  // SALZBURG
  { type:'festival', name:'Salzburger Festspiele',     city:'Salzburg, Austria',  mes:'July–August', desc:'Since 1920. The world\'s most prestigious classical music and opera festival. Six weeks; advance booking essential.', url:'https://www.salzburgerfestspiele.at/en', lat:47.7980, lng:13.0413 },
  { type:'sala',     name:'Mozarteum',                 city:'Salzburg, Austria',  desc:'Since 1914. Music university and concert hall. Year-round concerts; the musical hub of Salzburg outside the festival.',    url:'https://www.mozarteum.at/',         lat:47.7983, lng:13.0447 },
  // BAYREUTH
  { type:'festival', name:'Bayreuther Festspiele',     city:'Bayreuth, Germany', mes:'July–August', desc:'Since 1876. Founded by Richard Wagner. Sole programme: Wagner\'s operas. Waiting lists of over ten years.', url:'https://www.bayreuther-festspiele.de/en/', lat:49.9456, lng:11.5713 },
  // MILÀ
  { type:'opera',    name:'Teatro alla Scala',         city:'Milan, Italy',       desc:'Founded 1778. The world\'s most symbolically charged opera house. Verdi, Puccini, Callas, Karajan. Season opens 7 December.',           url:'https://www.teatroallascala.org/', lat:45.4673, lng:9.1895 },
  // VERONA
  { type:'festival', name:'Arena di Verona',           city:'Verona, Italy',     mes:'June–September', desc:'First-century Roman amphitheatre. The world\'s largest outdoor opera stage: 22,000 seats. Aida, Carmen, Turandot.', url:'https://www.arena.it/en/',          lat:45.4384, lng:10.9942 },
  // DRESDEN
  { type:'opera',    name:'Semperoper Dresden',        city:'Dresden, Germany',  desc:'Since 1841 (rebuilt 1985). Considered the most beautiful opera building in Europe. Home of the Staatskapelle Dresden, active since 1548.',     url:'https://www.semperoper.de/en.html', lat:51.0533, lng:13.7333 },
  { type:'festival', name:'Dresdner Musikfestspiele',  city:'Dresden, Germany',  mes:'May–June', desc:'Since 1978. Classical and contemporary music festival in Dresden and surroundings. Multiple venues, diverse disciplines.',  url:'https://www.musikfestspiele.com/en/', lat:51.0508, lng:13.7398 },
  // LEIPZIG
  { type:'sala',     name:'Gewandhaus zu Leipzig',     city:'Leipzig, Germany',  desc:'Since 1743. One of the world's most prestigious symphony orchestras. Mendelssohn and Mahler both served as chief conductors.',                       url:'https://www.gewandhaus.de/',        lat:51.3397, lng:12.3764 },
  { type:'sala',     name:'Thomaskirche / Bach-Museum',city:'Leipzig, Germany',  desc:'Bach served as Kantor of the Thomaskirche for 27 years. Choral concerts every Friday and Saturday. The adjacent Bach-Museum is the world's leading archive on the composer.', url:'https://www.bach-leipzig.de/en/', lat:51.3402, lng:12.3742 },
  // AMSTERDAM
  { type:'sala',     name:'Concertgebouw',             city:'Amsterdam, Netherlands', desc:'Since 1888. One of the three finest acoustic concert halls in the world (alongside Vienna's Musikverein and Boston Symphony Hall). Home of the Royal Concertgebouw Orchestra.', url:'https://www.concertgebouw.nl/en', lat:52.3562, lng:4.8783 },
  { type:'festival', name:'Holland Festival',          city:'Amsterdam, Netherlands', mes:'June', desc:'Since 1947. International performing arts festival: contemporary opera, music theatre and performance. Every June in Amsterdam.',   url:'https://www.hollandfestival.nl/en', lat:52.3680, lng:4.9036 },
  // PRAGA
  { type:'opera',    name:'Estates Theatre',           city:'Prague, Czech Republic', desc:'Since 1783. Mozart premiered Don Giovanni here in 1787. One of the best-preserved Baroque theatres in Europe. Still programmes opera.', url:'https://www.narodni-divadlo.cz/en/estates-theatre', lat:50.0853, lng:14.4200 },
  { type:'festival', name:'Prague Spring Festival',    city:'Prague, Czech Republic', mes:'May', desc:'Since 1946. Opens each year with Smetana\'s Má Vlast performed by the Czech Philharmonic. One of Europe\'s most emotionally charged season-opening rituals.', url:'https://www.festival.cz/en/', lat:50.0826, lng:14.4260 },
  // BARCELONA
  { type:'opera',    name:'Gran Teatre del Liceu',     city:'Barcelona, Spain', desc:'Founded 1847 (rebuilt 1999). One of the great opera houses of the Mediterranean. Season runs October to July. World-renowned Liceu Chorus.', url:'https://www.liceubarcelona.cat/', lat:41.3796, lng:2.1723 },
  { type:'sala',     name:'Palau de la Música Catalana', city:'Barcelona, Spain', desc:'Since 1908 (Domènech i Montaner). UNESCO World Heritage Site. The finest example of musical Art Nouveau in the world: stained glass, ceramics and exceptional acoustics.', url:'https://www.palaumusica.cat/ca', lat:41.3874, lng:2.1752 },
];

let allMarkers = [];
const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 });

locations.forEach(loc => {
  const icon = makeIcon(loc.type);
  const tLabel = typeLabel[loc.type] + (loc.mes ? ' · ' + loc.mes : '');
  const popup = `
    <div class="pop-name">${loc.name}</div>
    <div class="pop-type">${tLabel}</div>
    <div class="pop-info">${loc.city}<br>${loc.desc}</div>
    ${loc.url ? `<div class="pop-link"><a href="${loc.url}" target="_blank" rel="noopener noreferrer">↗ ${loc.url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}</a></div>` : ''}
  `;
  const marker = L.marker([loc.lat, loc.lng], { icon }).bindPopup(popup, { maxWidth: 280 });
  marker._locType = loc.type;
  allMarkers.push(marker);
  clusterGroup.addLayer(marker);
});

map.addLayer(clusterGroup);

function filterType(type, btn) {
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  clusterGroup.clearLayers();
  allMarkers.forEach(m => {
    if (type === 'all' || m._locType === type) clusterGroup.addLayer(m);
  });
}
</script>
</body>
</html>
