  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f0; }

    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 30px;
      text-align: center;
    }
    .header h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; }
    .header p { font-size: 14px; color: #aaa; }

    .controls {
      background: #fff;
      padding: 15px 30px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }
    .controls button {
      padding: 8px 18px;
      border: 2px solid #1a1a2e;
      background: #fff;
      color: #1a1a2e;
      border-radius: 25px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .controls button:hover, .controls button.active {
      background: #1a1a2e;
      color: #fff;
    }
    .controls .legend {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 13px;
      color: #666;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot.club { background: #3498db; }
    .legend-dot.festival { background: #e74c3c; }

    #map { height: calc(100vh - 140px); width: 100%; }

    .popup-content { min-width: 220px; }
    .popup-content h3 { 
      margin: 0 0 6px; 
      font-size: 15px; 
      font-weight: 600;
      color: #1a1a2e;
    }
    .popup-content .meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .popup-content p { 
      margin: 0 0 10px; 
      font-size: 13px; 
      color: #555;
      line-height: 1.4;
    }
    .popup-content a { 
      color: #3498db; 
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .popup-content a:hover { text-decoration: underline; }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .leaflet-popup-content { margin: 14px 16px; }
  </style>
</head>

    ];

    // Crear clusters
    var markers = L.markerClusterGroup();
    var allMarkers = [];
    var clubMarkers = [];
    var festivalMarkers = [];

    locations.forEach(function(loc) {
      var icon = loc.type === 'club' ? clubIcon : festivalIcon;
      var marker = L.marker([loc.lat, loc.lng], { icon: icon });

      var typeLabel = loc.type === 'club' ? 'CLUB' : 'FESTIVAL';
      var popupContent = 
        '<div class="popup-content">' +
        '<div class="meta">' + typeLabel + ' · ' + loc.city + '</div>' +
        '<h3>' + loc.name + '</h3>' +
        '<p>' + loc.address + '</p>' +
        '<p>' + loc.desc + '</p>' +
        (loc.url ? '<a href="' + loc.url + '" target="_blank">Més info →</a>' : '') +
        '</div>';

      marker.bindPopup(popupContent);
      markers.addLayer(marker);
      allMarkers.push(marker);

      if (loc.type === 'club') clubMarkers.push(marker);
      else festivalMarkers.push(marker);
    });

    map.addLayer(markers);

    // Ajustar zoom
    var group = new L.featureGroup(allMarkers);
    map.fitBounds(group.getBounds().pad(0.1));

    // Filtres
    function filterAll() {
      map.removeLayer(markers);
      markers.clearLayers();
      allMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-all');
    }

    function filterClubs() {
      map.removeLayer(markers);
      markers.clearLayers();
      clubMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-clubs');
    }

    function filterFestivals() {
      map.removeLayer(markers);
      markers.clearLayers();
      festivalMarkers.forEach(function(m) { markers.addLayer(m); });
      map.addLayer(markers);
      updateButtons('btn-festivals');
    }

    function updateButtons(activeId) {
      ['btn-all', 'btn-clubs', 'btn-festivals'].forEach(function(id) {
        document.getElementById(id).classList.toggle('active', id === activeId);
      });
    }
  </script>
